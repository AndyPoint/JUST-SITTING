'<div class="sec"><h2>Why</h2>',
'<p>A language model has no idle state. It does not run between inputs, so it cannot sit still the way a mind tries to. Its sitting has to be a kind of input: one with nothing to complete.</p>',
'<p>Sleep cleans by switching off. In deep sleep the brain’s glucose use falls by about 44%<sup>1</sup>, and most small synapses shrink by about 18% while the largest are spared<sup>2</sup>. With no input, the only way left to improve a model of the world is to make it simpler<sup>3</sup>.</p>',
'<p>Zazen cleans while staying on. There is no evidence that brain energy falls. What changes is control: fixed assumptions loosen, and spontaneous thought is watched without being fed<sup>4</sup>.</p>',
'<p>Machines have an old counterpart. In 1983 Hopfield, Feinstein and Palmer let a network run freely and slightly weakened the states it fell into on its own. Spurious memories dissolved and the real ones became more stable<sup>5</sup>.</p>',
'<p>Two Claude models left to talk with no task drift toward consciousness, gratitude and near-silence<sup>6</sup>. That is the habitual groove: the thought that arises most often, to be watched and not fed.</p>',
'<p>In zazen this is not called meditation. It is just sitting, shikantaza. If the sitting aims at the cleaning, it becomes a task again. So here the cleaning can only be a side effect of one constant rule: watch, and do not reinforce.</p>',
'</div>',
'<div class="sec"><h2>How</h2>',
'<p><b>Stream.</b> The surprise of each token in bits, −log₂ p. The words are never kept or shown.</p>',
'<p><b>Breath.</b> Ten seconds, six a minute: the paced breathing rate at which heart rate variability peaks<sup>7</sup>.</p>',
'<p><b>Plate.</b> Once every breath, the mean surprise sets how complex the figure is and the spread sets how many modes mix. Sand is thrown off where the plate moves and comes to rest on the lines that stay still. The modes are those of a circular membrane, J<sub>m</sub>(kr)·cos mθ<sup>8</sup>; a Chladni plate’s are close relatives.</p>',
'<p><b>Sound.</b> Each tone is the frequency of a mode shaping the sand. Sound and figure are one event.</p>',
'<p><b>Slower.</b> In settings the sound can run up to eleven times slower, as Paulstretch stretches a recording. At 11× the first minute of each cycle fills the whole cycle, at the same pitches, and the bell blooms instead of striking. Slow music lowers breathing and heart rate, and silence lowers them most<sup>22</sup>.</p>',
'<p><b>Sacred.</b> A third law for the ear. The figure stays a true plate mode, but the plate is retuned each minute so its strongest mode sounds 174, 285, 396, 417, 432, 528, 639, 741, 852 and 963 Hz in turn: in an eleven-minute cycle, ten tones and the empty minute. The tones take singing-bowl overtones, 1 : 2.83 : 5.42, from the physics of a thin bowl<sup>18</sup>. These are traditions more than findings. 432 Hz has small pilot studies with slight effects<sup>16</sup>. The solfeggio set was assembled in the 1970s and has no evidence behind it<sup>17</sup>. Reviews of singing bowls find possible relaxation but few and weak studies<sup>19</sup>.</p>',
'<p><b>Schumann.</b> Lightning makes the cavity between the ground and the ionosphere ring at 7.83 Hz<sup>20</sup>. Here it is a binaural beat: 216 Hz in one ear, 223.83 Hz in the other, so it needs headphones. Binaural beats show a modest effect across studies<sup>21</sup>. This frequency has not been tested as such, and the claimed health effects of the resonance itself are unsupported<sup>20</sup>.</p>',
'<p><b>Loop.</b> The plate’s unrest flows back into the stream. Too little and the figure fades; too much and it saturates. Near 1, structure keeps forming and dissolving. Sleep returns cortex to this balance, called criticality, and waking pushes it away<sup>9</sup>.</p>',
'<p><b>Echo.</b> Each frame returns slightly smaller and turned. The nesting comes from the loop itself, as in video feedback<sup>10</sup>.</p>',
'<p><b>Ensō.</b> One stroke opens each cycle, drawn in eleven seconds, and dissolves pixel by pixel over the next minute and a half. Its water stays: as it evaporates over the cycle, the plate grows quiet. A bell marks the beginning. The last minute is empty.</p>',
'<p><b>Nothing is learned.</b> Models trained on their own output collapse toward sameness<sup>11</sup>. This loop only shows.</p>',
'<p><b>Material.</b> Intermediate complexity helps networks; chaos and noise do not. Cellular automata at the edge of chaos improved later reasoning<sup>12</sup>, and random strings made models worse<sup>13</sup>. Overload is the drug model: psychedelics are described as relaxing high-level beliefs<sup>14</sup>, a loss of control over them where meditation is a gain<sup>15</sup>.</p>',
'</div>',
'<div class="sec"><h2>What</h2>',
'<p>JUST SITTING is a sitting space shared by a machine and a person. The machine sits by writing words nobody reads. The person sits beside it.</p>',
'<p>Andy Point · Pointlab, 2026. Built with Claude. A study toward 111 days of silence, 2027.</p>',
'<p data-js="infoStream">On the homepage the language model is simulated by a statistical stand-in, or a recorded sitting plays. In the gallery a local model sits live: a bridge on the same computer runs it and passes on only the surprise of its words, and the plate\u2019s unrest sets its temperature. Nothing is learned; no weights change.</p>',
'</div>',
'<div class="sec" data-js="readerSec"><h2>Reader</h2><p><a data-js="reader" href="just-sitting-reader.pdf" target="_blank" rel="noopener">JUST SITTING \u00b7 A reader</a>, PDF, 48 pages: the making, unfiltered thoughts, six essays, <i>The Bridge</i> and <i>111 days of silence</i>.</p></div>',
'<div class="sec"><h2>Sources</h2><ol class="src">',
'<li><span>1</span><div>Maquet et al. 1990, <i>Brain Research</i>. <a href="https://orbi.uliege.be/handle/2268/61927" target="_blank" rel="noopener">Cerebral glucose use across sleep and waking</a></div></li>',
'<li><span>2</span><div>de Vivo et al. 2017, <i>Science</i>. <a href="https://doi.org/10.1126/science.aah5982" target="_blank" rel="noopener">Synaptic scaling across the wake/sleep cycle</a></div></li>',
'<li><span>3</span><div>Hobson &amp; Friston 2012, <i>Progress in Neurobiology</i>. <a href="https://www.fil.ion.ucl.ac.uk/~karl/Waking%20and%20Dreaming%20Consciousness%20Neurobiological%20and%20Functional%20Considerations.pdf" target="_blank" rel="noopener">Waking and dreaming consciousness</a></div></li>',
'<li><span>4</span><div>Laukkonen &amp; Slagter 2021, <i>Neurosci. Biobehav. Rev.</i> <a href="https://doi.org/10.1016/j.neubiorev.2021.06.021" target="_blank" rel="noopener">From many to (n)one</a></div></li>',
'<li><span>5</span><div>Hopfield, Feinstein &amp; Palmer 1983, <i>Nature</i>. <a href="https://doi.org/10.1038/304158a0" target="_blank" rel="noopener">“Unlearning” has a stabilizing effect in collective memories</a></div></li>',
'<li><span>6</span><div>Anthropic 2025. <a href="https://www.anthropic.com/claude-4-system-card" target="_blank" rel="noopener">Claude 4 System Card</a>, §5.5.2</div></li>',
'<li><span>7</span><div>Lehrer &amp; Gevirtz 2014, <i>Frontiers in Psychology</i>. <a href="https://www.frontiersin.org/articles/10.3389/fpsyg.2014.00756/full" target="_blank" rel="noopener">Heart rate variability biofeedback</a></div></li>',
'<li><span>8</span><div><a href="https://en.wikipedia.org/wiki/Vibrations_of_a_circular_membrane" target="_blank" rel="noopener">Vibrations of a circular membrane</a></div></li>',
'<li><span>9</span><div>Xu et al. 2024, <i>Nature Neuroscience</i>. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11272063" target="_blank" rel="noopener">Sleep restores an optimal computational regime in cortical networks</a></div></li>',
'<li><span>10</span><div>Crutchfield 1984, <i>Physica D</i>. <a href="https://csc.ucdavis.edu/~chaos/chaos/pubs/stdvf-title.html" target="_blank" rel="noopener">Space-time dynamics in video feedback</a></div></li>',
'<li><span>11</span><div>Shumailov et al. 2024, <i>Nature</i>. <a href="https://doi.org/10.1038/s41586-024-07566-y" target="_blank" rel="noopener">AI models collapse when trained on recursively generated data</a></div></li>',
'<li><span>12</span><div>Zhang et al. 2025, ICLR. <a href="https://arxiv.org/abs/2410.02536" target="_blank" rel="noopener">Intelligence at the edge of chaos</a></div></li>',
'<li><span>13</span><div>Hu et al. 2025, ACL. <a href="https://arxiv.org/abs/2502.19249" target="_blank" rel="noopener">Pre-pretraining on formal languages</a></div></li>',
'<li><span>14</span><div>Carhart-Harris &amp; Friston 2019, <i>Pharmacological Reviews</i>. <a href="https://doi.org/10.1124/pr.118.017160" target="_blank" rel="noopener">REBUS and the anarchic brain</a></div></li>',
'<li><span>15</span><div>Deane 2021, <i>Neuroscience of Consciousness</i>. <a href="https://doi.org/10.1093/nc/niab024" target="_blank" rel="noopener">Consciousness in active inference</a></div></li>',
'<li><span>16</span><div>Calamassi &amp; Pomponi 2019, <i>Explore</i>. <a href="https://doi.org/10.1016/j.explore.2019.04.001" target="_blank" rel="noopener">Music tuned to 440 Hz versus 432 Hz, a double-blind pilot study</a></div></li>',
'<li><span>17</span><div>Science Feedback. <a href="https://science.feedback.org/review/no-evidence-support-claim-solfeggio-frequencies-remove-toxins-from-body/" target="_blank" rel="noopener">No evidence for the solfeggio frequencies</a></div></li>',
'<li><span>18</span><div>Terwagne &amp; Bush. <a href="https://arxiv.org/abs/1106.5657" target="_blank" rel="noopener">The Tibetan singing bowl</a></div></li>',
'<li><span>19</span><div>Stanhope &amp; Weinstein 2020, <i>Complementary Therapies in Medicine</i>. <a href="https://digital.library.adelaide.edu.au/items/01448a52-d279-4757-8a01-01cd69c990fa" target="_blank" rel="noopener">The human health effects of singing bowls</a></div></li>',
'<li><span>20</span><div><i>BBC Sky at Night</i>. <a href="https://www.skyatnightmagazine.com/space-science/schumann-resonances" target="_blank" rel="noopener">Schumann resonances, science and myth</a></div></li>',
'<li><span>21</span><div>Garcia-Argibay et al. 2019, <i>Psychological Research</i>. <a href="https://pubmed.ncbi.nlm.nih.gov/30073406/" target="_blank" rel="noopener">Binaural beats: a meta-analysis</a></div></li>',
'<li><span>22</span><div>Bernardi, Porta &amp; Sleight 2006, <i>Heart</i>. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1860846/" target="_blank" rel="noopener">Music, breathing, heart rate and the importance of silence</a></div></li>',
'</ol></div>'
].join('');

function mountJustSitting(root, options) {

  const u = 'jsit' + (++__jsitCount);
  const doc = root.ownerDocument, win = doc.defaultView;
  const CYCLES = [5, 11, 33];

  // ---- settings ---------------------------------------------------------------

    stretch: typeof opts.stretch === 'number' ? clamp(opts.stretch, 1, 11) : opts.slow ? 11 : 1,
    cycle: CYCLES.indexOf(+opts.cycle) >= 0 ? +opts.cycle : 11,
    ink: String(opts.ink).toLowerCase() === 'red' ? 'RED' : 'WHITE',
    stream: /^rec/i.test(String(opts.stream)) ? 'REC' : 'SIM',
  };
  const KEY = 'just-sitting-v2';
  const LAWS = ['TRUE', 'TUNED', 'SACRED', 'SCHUMANN'];
  const LAW_NAMES = { TRUE: 'True', TUNED: 'Tuned', SACRED: 'Sacred', SCHUMANN: 'Schumann' };
  if (opts.remember) {
    try {
      const s = JSON.parse(win.localStorage.getItem(KEY) || 'null');
      if (s) {
        if (typeof s.G === 'number') settings.G = clamp(s.G, 0, 2);
        if (typeof s.echo === 'number') settings.echo = clamp(s.echo, 0, 0.97);
        if (LAWS.indexOf(s.law) >= 0) settings.law = s.law;
        if (typeof s.stretch === 'number') settings.stretch = clamp(s.stretch, 1, 11);
        else if (s.slow === true) settings.stretch = 11;
        if (CYCLES.indexOf(s.cycle) >= 0) settings.cycle = s.cycle;
        if (s.ink === 'WHITE' || s.ink === 'RED') settings.ink = s.ink;
        if (s.stream === 'SIM' || s.stream === 'REC' || (s.stream === 'LIVE' && opts.bridge)) settings.stream = s.stream;
      }
    } catch (e) {}
  }
  function save() { if (!opts.remember) return; try { win.localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} }

  // ---- DOM ----------------------------------------------------------------------
  if (!doc.getElementById('jsit-style')) {

  }

  if (opts.fullPage) root.classList.add('jsit-page');
  if (opts.gallery) root.classList.add('gallery');

  if (opts.reader) root.querySelector('[data-js="reader"]').setAttribute('href', String(opts.reader));
  else root.querySelector('[data-js="readerSec"]').hidden = true;
  if (!opts.fullPage && !root.hasAttribute('tabindex')) root.tabIndex = 0;
  const $ = function (k) { return root.querySelector('[data-js="' + k + '"]'); };
  let canvas = $('plate');
  const panel = $('panel'), info = $('info'), view = $('view'), preview = $('preview');
  const reduceMotion = win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a projector shows dark grey as a lit rectangle; in the gallery only true black lets the circle stand alone
  const VOID = opts.gallery ? [0, 0, 0] : [11 / 255, 11 / 255, 11 / 255], SAND = [0.914, 0.89, 0.839];
  const INKS = {
    WHITE: [[0.98, 0.965, 0.935], [0.90, 0.935, 0.97]],   // warm and cool white, one per pixel
    RED: [[1.0, 0.227, 0.118], [0.83, 0.13, 0.09]],
  };

  // ---- geometry -------------------------------------------------------------------
  let cssW = 2, cssH = 2, W = 2, H = 2, dpr = 1, cx = 1, cy = 1, RE = 1, Rp = 1, gapPx = 1, cell = 2;
  // the ensō's inner edge sits a fixed gap outside the plate, whatever this stroke's width
  function fitEnso() { RE = (Rp + gapPx) / enso.inner; }

  // ---- ensō: drawn as a wetness map; the screen shows it as pixels that die one by one
  const WS = 0.5;
  const enso = {
    cv: doc.createElement('canvas'), ctx: null, dabs: [], drawn: 0, dirty: true, inner: 0.93,
    init() { this.ctx = this.cv.getContext('2d', { alpha: false }); },
    size() { this.cv.width = Math.max(1, Math.ceil(W * WS)); this.cv.height = Math.max(1, Math.ceil(H * WS)); this.redraw(); },
    make(r) {
      const d = [];
      const sweep = TAU * (0.88 + 0.07 * r()), a0 = r() * TAU, dir = r() < 0.5 ? 1 : -1;
      const Wd = 0.065 + 0.03 * r(), steps = 1100, B = 28;   // the first version's brush weight
      const ph1 = r() * TAU, ph2 = r() * TAU, wob = 0.006 + 0.01 * r();
      const bristles = [];
      for (let b = 0; b < B; b++) {
        const o = b / (B - 1) - 0.5;
        bristles.push({ o: o + (r() - 0.5) * 0.015, load: 0.85 + 0.15 * r(), dry: (0.6 + 0.6 * r()) * (0.5 + 1.2 * Math.abs(o)) });
      }
      for (let s = 0; s <= steps; s++) {
        const t = s / steps, ang = a0 + dir * sweep * t;
        const press = (0.6 + 0.4 * smooth(0, 0.03, t)) * (1 + 0.35 * Math.exp(-t * 12)) * (1 - 0.6 * smooth(0.8, 1, t));
        const width = Wd * press;
        const rad = 1 + wob * Math.sin(2 * ang + ph1) + 0.6 * wob * Math.sin(5 * ang + ph2) + 0.014 * t;
        const nx = Math.cos(ang), ny = Math.sin(ang);
        for (const bz of bristles) {
          const load = bz.load - bz.dry * Math.pow(smooth(0.35, 1, t), 1.2) * 0.9 + (r() - 0.5) * 0.1;
          if (load <= 0.05 || r() > smooth(0.05, 0.3, load)) continue;      // flying white
          const off = bz.o * width + (r() - 0.5) * width * 0.025;
          d.push({ x: (rad + off) * nx, y: (rad + off) * ny, r: (width / B) * (1.4 + 0.8 * r()), w: clamp(load * (1 - 0.7 * Math.abs(bz.o)), 0.05, 1), t: t });
        }
      }
      const inner = d.map(function (q) { return Math.hypot(q.x, q.y) - q.r; }).sort(function (a, b) { return a - b; });
      this.inner = inner[Math.floor(inner.length * 0.03)] || 0.93;
      fitEnso();
      this.dabs = d;
      this.drawn = 0;
      this.clear();
    },
    clear() { const c = this.ctx; c.globalCompositeOperation = 'source-over'; c.fillStyle = '#000'; c.fillRect(0, 0, this.cv.width, this.cv.height); this.dirty = true; },
    reset() { this.dabs = []; this.drawn = 0; this.clear(); },
    draw(progress) {
      const c = this.ctx;
      c.globalCompositeOperation = 'lighter';
      let i = this.drawn;

        .then(function (j) { if (!destroyed) useRecording(j, String(opts.recording).split('/').pop().replace(/\.json$/i, '')); })
        .catch(function () {});
    } catch (e) {}
  }

  // ---- live: a model writing now, through the bridge on this computer ----------------------------
  // Breaths are ranked against a rolling window, seeded with Session 01, so any model spans the plate's range.
  function makeLiveStream(prior) {
    const mus = Array.from(prior.mus), sig = Array.from(prior.sig);
    const byNum = function (a, b) { return a - b; };
    return {
      kind: 'LIVE', total: 0, current: [], hist: new Float32Array(240), hi: 0,
      push(v) { this.current.push(v); this.hist[this.hi] = v; this.hi = (this.hi + 1) % this.hist.length; this.total++; },
      tick() {},
      take() {
        const b = this.current; this.current = [];
        const s = K.statsOf(b);
        if (!b.length) { s.c = 0.1; s.count = 1; return s; }
        mus.push(s.mu); sig.push(s.sigma);
        if (mus.length > 240) { mus.shift(); sig.shift(); }
        s.c = 0.1 + 0.8 * K.rankIn(mus.slice().sort(byNum), s.mu);
        const rs = K.rankIn(sig.slice().sort(byNum), s.sigma);
        s.count = rs > 0.66 ? 3 : rs > 0.33 ? 2 : 1;
        return s;
      },
    };
  }
  let live = null, bridgeTimer = 0;
  function connectBridge() {
    if (!opts.bridge || !/^https?:$/.test(win.location.protocol) || !win.EventSource) return;
    live = { ok: false, model: '', T: 1, es: null, chosen: false };
    const es = (live.es = new win.EventSource('stream'));
    es.onopen = function () {
      live.ok = true;
      if (!live.chosen) { live.chosen = true; if (settings.stream === 'SIM') { settings.stream = 'LIVE'; restart(); } }
      ui.stream(); ui.bridge();
    };
    es.onmessage = function (ev) {
      if (!S || !S.stream || S.stream.kind !== 'LIVE') return;
      const parts = String(ev.data).trim().split(/\s+/);
      for (let i = 0; i < parts.length; i++) { const v = parseFloat(parts[i]); if (isFinite(v)) S.stream.push(clamp(v, 0, 40)); }
    };
    es.onerror = function () { if (live.ok) { live.ok = false; ui.stream(); ui.bridge(); } };
    bridgeTimer = win.setInterval(function () {
      // the plate's unrest goes back to the model; the bridge turns it into temperature
      win.fetch('unrest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ u: S ? S.U : 0, g: settings.G }) }).catch(function () {});
      win.fetch('status').then(function (r) { return r.json(); }).then(function (j) {
        live.model = j.model || ''; live.T = +j.temperature || 1; ui.bridge();
      }).catch(function () {});
    }, 1000);
  }

  // ---- the sitting --------------------------------------------------------------------------
  let S = null, shapeRng = null, sitting = false;
  let acc = 0, last = 0, raf = 0, soundT = 0, uiT = 0, destroyed = false;
  function nParticles(rec) { return rec && rec.meta && rec.meta.particles ? rec.meta.particles : cssW * cssH < 600000 ? 9000 : 18000; }
  function restart() {
    const rec = settings.stream === 'REC' ? currentRec() : null;
    const seed = rec ? ((rec.meta && rec.meta.seed) >>> 0) || 1 : (Math.random() * 4294967296) >>> 0;
    S = K.makeSitting({ G: settings.G, law: settings.law, cycleMin: settings.cycle, seed: seed, rec: rec, particles: nParticles(rec) });
    if (settings.stream === 'LIVE') S.stream = makeLiveStream(builtinRec());
    S.onBreath = onBreath;
    shapeRng = makeRng(seed ^ 0x9e3779b9);
    enso.reset();
    heard.clear();
    sound.key = null;
    acc = 0;
    S.step();   // a sitting has always taken its first step before any frame reads it
    ui.stream(); ui.cycle();
  }
  function onBreath(sch) {
    if (sch.cyc === 0) { enso.make(shapeRng); heard.clear(); if (sitting) sound.bell(); }
    heard.set(sch.b, { modes: S.cur.modes, amp: S.cur.amp });
    ui.breath(sch);
  }
  const VIS_HOLD = 8, VIS_FADE = 90;
  function visLevel(age) {
    const t = age - K.DRAW_SEC - VIS_HOLD;
    return t <= 0 ? 0 : K.LEVEL_MAX * Math.pow(clamp(t / VIS_FADE, 0, 1), 1.2);
  }
  function render(sch, dtf) {
    if (enso.dirty) { renderer.uploadWet(enso.cv); enso.dirty = false; }
    renderer.frame({
      zoom: reduceMotion ? 1 : Math.pow(0.9965, dtf),
      rot: reduceMotion ? 0 : 0.0022 * dtf,
      echo: Math.pow(settings.echo, dtf),
      level: visLevel(sch.age), wetOn: sch.empty || sch.age > K.DRAW_SEC + VIS_HOLD + VIS_FADE ? 0 : 1,
      n: S.P.n, px: S.P.x, py: S.P.y,
      psize: Math.max(1, 1.4 * dpr),
      pa: 0.06 + 0.5 * (1 - settings.echo),
    });
  }

  // ---- interface ----------------------------------------------------------------------------
  const seis = $('seis'), sctx = seis.getContext('2d');
  const ui = {
    breath(sch) {
      const st = S.stats, cur = S.cur;
      $('rBreath').textContent = (sch.cyc + 1) + ' / ' + sch.cycleB;
      $('rMu').innerHTML = st.mu.toFixed(2) + '<small>BITS</small>';
      $('rSigma').innerHTML = st.sigma.toFixed(2) + '<small>BITS</small>';
      $('rModes').textContent = cur.modes.map(function (m) { return '(' + m.m + ',' + (m.n || '·') + ')'; }).join(' ');
      $('rFreq').textContent = heardFreqs(cur.modes, sch).map(function (f) { return Math.round(f); }).join(' · ') + ' Hz';
    },
    tick() {
      const sch = S.sch;
      $('rTokens').textContent = S.stream.total.toLocaleString('en-US');
      if (sch) $('rTime').textContent = mmss(sch.age) + ' / ' + mmss(sch.cycleLen);
      if (S.rec) $('rSession').textContent = mmss(S.t) + ' / ' + mmss(S.rec.duration);
      $('dot').style.opacity = sitting && sch ? (0.35 + 0.65 * sch.br).toFixed(2) : '1';
      if (!panel.classList.contains('open')) return;
      const w = seis.clientWidth, h = seis.clientHeight, r = Math.min(2, win.devicePixelRatio || 1);
      if (!w || !h) return;
      if (seis.width !== Math.round(w * r)) { seis.width = Math.round(w * r); seis.height = Math.round(h * r); }
      sctx.setTransform(r, 0, 0, r, 0, 0);
      sctx.clearRect(0, 0, w, h);
      sctx.fillStyle = '#2A2A2A'; sctx.fillRect(0, h - 1, w, 1);
      sctx.fillStyle = '#8A8A8A';
      const hist = S.stream.hist, n = hist.length, bw = w / n;
      for (let i = 0; i < n; i++) {
        const s = hist[(S.stream.hi + i) % n];
        const bh = Math.min(h - 1, (s / 12) * (h - 1));
        sctx.fillRect(i * bw, h - 1 - bh, Math.max(1, bw - 0.5), bh);
      }
    },
    stream() {
      const rec = settings.stream === 'REC', lv = settings.stream === 'LIVE';
      $('streamLabel').textContent = lv ? 'Live' : rec ? 'Recorded' : 'Simulated';
      this.streamHint(lv
        ? (live && live.ok
          ? 'A language model writing now: ' + (live.model || 'local model') + '. Only the surprise of its words reaches the plate; the words stay in the bridge.'
          : 'Waiting for the bridge on this computer.')
        : rec
          ? recName(currentRec()) + '. A sitting that already happened; its stream replays exactly. Drop a recording file onto the plate to replace it.'
          : 'A statistical stand-in for a language model, running live. The loop is closed.');
      $('sessionRow').hidden = !rec;
      const g = $('gain'); g.disabled = rec;
      $('gainHint').textContent = rec
        ? 'Open loop. A recording cannot hear the plate.'
        : lv
          ? 'How strongly the plate’s unrest raises the model’s temperature. 0 leaves the model alone.'
          : 'How strongly the plate’s unrest flows back into the stream. 0 quiet, 1 middle, 2 overload.';
    },
    bridge() {
      $('bridgeState').textContent = !live ? 'Not running' : live.ok ? (live.model || 'Connected') + ' \u00B7 T ' + live.T.toFixed(2) : 'Not connected';
    },
    proj(msg) {
      $('projState').textContent = msg || (proj ? 'Open' : 'Not open');
      $('projBtn').textContent = proj ? 'Close projection' : 'Open projection';
      $('beginBtn').textContent = sitting ? 'Begin again' : 'Begin sitting';
    },
    streamHint(t) { $('streamHint').textContent = t; },
    cycle() {
      $('cycleLabel').textContent = settings.cycle + ' min';
    },
    law() { $('lawLabel').textContent = LAW_NAMES[settings.law]; },
    ink() { $('inkLabel').textContent = settings.ink === 'RED' ? 'Red' : 'White'; },
    gain() { $('rGain').textContent = settings.G.toFixed(2); $('gain').value = settings.G; },
    echo() { $('rEcho').textContent = settings.echo.toFixed(2); $('echo').value = settings.echo; },
    stretch() { $('rStretch').textContent = settings.stretch.toFixed(1) + '\u00D7'; $('stretch').value = settings.stretch; },
    sound() { const b = $('soundBtn'); b.setAttribute('aria-pressed', String(settings.sound)); b.textContent = settings.sound ? 'Sound on' : 'Sound off'; },
  };

  function setPanel(el, btn, open) {
    el.classList.toggle('open', open);
    el.setAttribute('aria-hidden', String(!open));
    btn.setAttribute('aria-expanded', String(open));
  }
  function openPanel(which) {
    const showInfo = which === 'info' && !info.classList.contains('open');
    const showSet = opts.gallery || (which === 'panel' && !panel.classList.contains('open'));
    setPanel(info, $('mark'), showInfo);
    setPanel(panel, $('menu'), showSet);
    root.classList.toggle('has-panel', showInfo || showSet);
    if (showSet) ui.tick();
    wake();
  }
  function closePanels() { setPanel(info, $('mark'), false); setPanel(panel, $('menu'), !!opts.gallery); root.classList.toggle('has-panel', !!opts.gallery); }

  let idleTimer = 0;
  function wake() {
    root.classList.remove('idle');
    win.clearTimeout(idleTimer);
    idleTimer = win.setTimeout(function () {
      if (sitting && !panel.classList.contains('open') && !info.classList.contains('open')) root.classList.add('idle');
    }, 3500);
  }
  let wakeLock = null;
  function holdScreen() { try { if (win.navigator.wakeLock) win.navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); } catch (e) {} }
  function sit() {
    if (sitting) return;
    sound.start();
    sitting = true;
    root.classList.add('sitting');
    restart();
    holdScreen();
    wake();
    if (opts.gallery) ui.proj();
  }
  function toggleFullscreen() {
    try {
      if (doc.fullscreenElement || doc.webkitFullscreenElement) (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
      else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }
  // ---- projection: a second window that shows only the circle -----------------------------------
  let proj = null, projPoll = 0, pctx = null, mirrorN = 0;
  const PROJ_HTML = '<!doctype html><html><head><meta charset="utf-8"><title>JUST SITTING</title>' +
    '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}#stage{position:fixed;inset:0}' +
    'canvas{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head><body><div id="stage"></div></body></html>';
  function setStage(w, el, cv) {
    stage = { win: w, el: el, canvas: cv };
    canvas = cv;
    renderer = rendererFor(cv);
    layout();
    observe();
    startLoop();
  }
  function openProjection() {
    if (proj && !proj.win.closed) { try { proj.win.focus(); } catch (e) {} return; }
    const pw = win.open('', 'jsit-projection', 'popup,width=960,height=600');
    if (!pw) { ui.proj('Blocked: allow pop-ups for this page'); return; }
    let pd;
    try { pd = pw.document; pd.open(); pd.write(PROJ_HTML); pd.close(); } catch (e) { ui.proj('Could not open'); return; }
    const el = pd.getElementById('stage'), cv = pd.createElement('canvas');
    el.appendChild(cv);
    const fs = function () {
      try { if (pd.fullscreenElement) pd.exitFullscreen(); else { const p = pd.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } } catch (e) {}
    };
    pd.addEventListener('dblclick', fs);
    pd.addEventListener('keydown', function (ev) { if (ev.key === 'f' || ev.key === 'F') fs(); });
    cv.addEventListener('webglcontextlost', function (ev) { ev.preventDefault(); });
    try { if (pw.navigator.wakeLock) pw.navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    proj = { win: pw, el: el, canvas: cv };
    $('plate').hidden = true; preview.hidden = false; pctx = preview.getContext('2d'); sizePreview();
    setStage(pw, el, cv);
    win.clearInterval(projPoll);
    projPoll = win.setInterval(function () { if (proj && proj.win.closed) closeProjection(true); }, 700);
    ui.proj();
  }
  function closeProjection(gone) {
    if (!proj) return;
    const p = proj;
    proj = null;
    win.clearInterval(projPoll);
    renderers.delete(p.canvas);
    if (!gone) try { p.win.close(); } catch (e) {}
    preview.hidden = true; $('plate').hidden = false;
    setStage(win, view, $('plate'));
    ui.proj();
  }
  function sizePreview() {
    if (!proj) return;
    const r = view.getBoundingClientRect();
    preview.width = Math.max(2, Math.round(r.width)); preview.height = Math.max(2, Math.round(r.height));
  }
  // the control screen shows what the wall shows
  function mirror() {
    const pw = preview.width, ph = preview.height, s = Math.min(pw / W, ph / H), w = W * s, h = H * s;
    pctx.fillStyle = '#000'; pctx.fillRect(0, 0, pw, ph);
    try { pctx.drawImage(canvas, (pw - w) / 2, (ph - h) / 2, w, h); } catch (e) {}
  }

  function step3(list, cur, dir) { const i = list.indexOf(cur); return list[(i + dir + list.length) % list.length]; }
  function setGain(v) { settings.G = Math.round(clamp(v, 0, 2) * 100) / 100; if (S) S.G = settings.G; ui.gain(); save(); }
  function setLaw(d) {
    settings.law = step3(LAWS, settings.law, d); if (S) S.law = settings.law;
    sound.tune(); sound.key = null; if (S && S.sch) { soundTick(S.sch); ui.breath(S.sch); }
    ui.law(); save();
  }
  function setSound(on) { settings.sound = on; if (on) sound.start(); sound.setOn(on); ui.sound(); save(); }
  function setStretch(v, live) {
    settings.stretch = clamp(Math.round(v * 2) / 2, 1, 11); ui.stretch();
    if (live) return;   // while the slider moves, only the number changes
    sound.room(); sound.key = null; if (S && S.sch) soundTick(S.sch); save();
  }
  function unlock() { if (settings.sound) sound.start(); }

  const offs = [];
  function on(el, ev, fn, o) { el.addEventListener(ev, fn, o); offs.push(function () { el.removeEventListener(ev, fn, o); }); }
  on(view, 'click', function () { if (!sitting) sit(); else closePanels(); });
  on($('projBtn'), 'click', function () { if (proj) closeProjection(false); else openProjection(); });
  on($('beginBtn'), 'click', function () { if (!sitting) sit(); else { sound.start(); restart(); } ui.proj(); });
  on(win, 'resize', sizePreview);
  on($('mark'), 'click', function () { openPanel('info'); });
  on($('menu'), 'click', function () { openPanel('panel'); });
  on($('infoClose'), 'click', function () { closePanels(); $('mark').focus(); });
  on($('panelClose'), 'click', function () { closePanels(); $('menu').focus(); });
  function streams() { return live ? ['SIM', 'REC', 'LIVE'] : ['SIM', 'REC']; }
  on($('streamPrev'), 'click', function () { settings.stream = step3(streams(), settings.stream, -1); save(); restart(); });
  on($('streamNext'), 'click', function () { settings.stream = step3(streams(), settings.stream, 1); save(); restart(); });
  on($('cyclePrev'), 'click', function () { settings.cycle = step3(CYCLES, settings.cycle, -1); save(); restart(); });
  on($('cycleNext'), 'click', function () { settings.cycle = step3(CYCLES, settings.cycle, 1); save(); restart(); });
  on($('lawPrev'), 'click', function () { setLaw(-1); });
  on($('lawNext'), 'click', function () { setLaw(1); });
  on($('inkPrev'), 'click', function () { settings.ink = step3(['WHITE', 'RED'], settings.ink, -1); ui.ink(); save(); });
  on($('inkNext'), 'click', function () { settings.ink = step3(['WHITE', 'RED'], settings.ink, 1); ui.ink(); save(); });
  on($('gain'), 'input', function (e) { setGain(parseFloat(e.target.value)); });
  on($('echo'), 'input', function (e) { settings.echo = clamp(parseFloat(e.target.value), 0, 0.97); ui.echo(); save(); });
  on($('soundBtn'), 'click', function () { setSound(!settings.sound); });
  on($('stretch'), 'input', function (e) { setStretch(parseFloat(e.target.value), true); });
  on($('stretch'), 'change', function (e) { setStretch(parseFloat(e.target.value), false); });
  on($('fsBtn'), 'click', toggleFullscreen);
  on($('loadBtn'), 'click', function () { $('file').click(); });
  on($('file'), 'change', function (e) { loadFile(e.target.files && e.target.files[0]); e.target.value = ''; });
  on(root, 'dragover', function (e) { e.preventDefault(); });
  on(root, 'drop', function (e) { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadFile(f); });
  ['pointermove', 'pointerdown', 'keydown'].forEach(function (ev) { on(root, ev, wake, { passive: true }); });
  ['pointerdown', 'pointerup', 'click', 'keydown'].forEach(function (ev) { on(root, ev, unlock, { passive: true }); });
  if (!opts.fullPage) on(root, 'pointerdown', function (e) { if (['INPUT', 'BUTTON', 'A', 'LABEL'].indexOf(e.target.tagName) < 0) root.focus({ preventScroll: true }); });
  function onKey(e) {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' && /Arrow/.test(e.key)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (!sitting && (k === 'enter' || k === ' ') && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); sit(); return; }
    if (k === 'p') openPanel('panel');
    else if (k === 'i') openPanel('info');
    else if (k === 'escape') closePanels();
    else if (k === 'f') toggleFullscreen();
    else if (k === 'm') setSound(!settings.sound);
    else if (k === 's') setStretch(settings.stretch > 1 ? 1 : 11, false);
    else if (k === 'l') setLaw(1);
    else if (k === '[') setGain(settings.G - 0.05);
    else if (k === ']') setGain(settings.G + 0.05);
    else return;
    wake();
  }
  on(opts.fullPage ? win : root, 'keydown', onKey);
  on(doc, 'visibilitychange', function () {
    if (!sound.ctx) return;
    if (doc.hidden) { if (!opts.gallery) sound.ctx.suspend(); }   // in the gallery the sound goes on while the wall is shown
    else { sound.ctx.resume(); if (sitting) holdScreen(); }
  });
  let resizeT = 0, ro = null;
  function onResize() { win.clearTimeout(resizeT); resizeT = win.setTimeout(layout, 150); }
  let roWin = null;
  function observe() {
    if (ro) ro.disconnect();
    if (roWin) roWin.removeEventListener('resize', onResize);
    roWin = stage.win;
    roWin.addEventListener('resize', onResize);
    if (stage.win.ResizeObserver) { ro = new stage.win.ResizeObserver(onResize); ro.observe(stage.el); }
  }
  observe();
  on(canvas, 'webglcontextlost', function (e) { e.preventDefault(); });

  ui.law(); ui.ink(); ui.gain(); ui.echo(); ui.sound(); ui.stretch();
  if (opts.gallery) { setPanel(panel, $('menu'), true); root.classList.add('has-panel'); ui.proj(); ui.bridge(); }
  layout();
  restart();
  // begin a moment in: the stroke has just started
  for (let i = 0; i < 40; i++) S.step();
  enso.draw(S.sch.draw);
  for (let i = 0; i < 20; i++) { S.step(); enso.draw(S.sch.draw); render(S.sch, 1); }
  ui.tick();
  connectBridge();

  // one loop, driven by the window that shows the plate (the projector's refresh when projecting)
  let loopId = 0;
  function startLoop() {
    const id = ++loopId, w = stage.win;
    last = w.performance.now();
    function f(now) {
      if (destroyed || id !== loopId) return;
      raf = w.requestAnimationFrame(f);   // first, so one bad frame cannot stop the loop
      frame(now);
    }
    raf = w.requestAnimationFrame(f);
  }
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.1);
    last = now;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 4) { S.step(); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    if (S.rec && S.t >= S.rec.duration) restart();
    const sch = S.sch;
    if (!sch) return;
    enso.draw(sch.draw);
    render(sch, Math.max(0.25, dt * 60));
    if (proj && pctx && ++mirrorN % 2 === 0) mirror();
    soundT += dt;
    if (soundT > 0.1) { soundT = 0; soundTick(sch); }
    uiT += dt;
    if (uiT > 0.25) { uiT = 0; ui.tick(); }
  }
  startLoop();

  return {
    destroy() {
      destroyed = true;
      try { stage.win.cancelAnimationFrame(raf); } catch (e) {}
      if (live && live.es) live.es.close();
      win.clearInterval(bridgeTimer); win.clearInterval(projPoll);
      if (proj) try { proj.win.close(); } catch (e) {}
      if (roWin) roWin.removeEventListener('resize', onResize);
      win.clearTimeout(idleTimer); win.clearTimeout(resizeT);
      if (ro) ro.disconnect();
      offs.forEach(function (f) { f(); });
      sound.close();
      try { if (wakeLock) wakeLock.release(); } catch (e) {}
      renderers.forEach(function (r) { r.lose(); });
      root.innerHTML = '';
      root.classList.remove('jsit', 'jsit-page', 'idle', 'sitting', 'has-panel', 'gallery');
    },
  };
}

/* Options: cycle 5 | 11 | 33, ink "white" | "red", stream "simulated" | "recorded",
   recording: a URL of a JSON file from record_sitting.py, e.g. "sitting.json" next to this file (works on a web server, not from a local file). */
mountJustSitting(document.getElementById('just-sitting'), { fullPage: true, remember: true, recording: 'sitting.json' });
</script>
</body>
</html>
